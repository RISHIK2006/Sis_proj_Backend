spring.application.name=backend
server.port=8080

# MySQL — set DB_URL, DB_USERNAME, DB_PASSWORD in the environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridesync}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing schema is source of truth — do not recreate or alter tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Gemini — optional; chatbot falls back if missing
ridesync.gemini.api-key=${GEMINI_API_KEY:}
ridesync.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
